# 海外读透映射表(人工维护,入库)—— design `docs/specs/2026-08-28-external-evidence-expansion-design.md` §8。
#
# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║ 本表示「值得观察的关系」,**不表示因果方向、涨跌传导方向或评级方向**。                     ║
# ║ 渲染时禁止写「A 涨所以 B 应涨」(§8 规则一;`readthrough.py` 模块 docstring 同一句)。      ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝
#
# ── 初版状态:**全部条目 `status: pending_evidence` + `evidence_url: null`** ────────────────
#
#   每一条关系都需要一份**可核对的公开凭证**(客户/供应商披露、招股书或年报的客户集中度章节、
#   基金持仓页、交易所公告 …)。写这份初版时**没有任何一条被真实核对过**,所以按 §8 的纪律
#   一律留 `null` 并标 `pending_evidence` —— **禁止编造 URL**。后果(由代码强制,不是自觉):
#
#     · `readthrough.load_map()` 直接把它们**全部剔除** ⇒ 当前本表的可消费条目数 = 0
#       ⇒ sector pack 的 `readthrough` 键整键不存在,报告里一个字都不会出现;
#     · `readthrough.lint_map()` 把它们报成 `PENDING`(不是 ERROR)—— 这是**合法的待办**形态,
#       不是文件坏了。ERROR 只留给「有 URL 但不是公网 http(s)」「枚举非法」「过期区间倒挂」这类真错。
#
#   转正流程(人工,走 PR):找到凭证 → 填 `evidence_url`(公网 http(s),不带追踪参数)→
#   `status` 改 `active` → 补 `effective_from`。**只改 status 不填 URL 会被 lint 判 ERROR**
#   (「声称已核实却拿不出凭证」比 pending 更坏)。
#
# ── 字段(§8 schema v2 逐字) ───────────────────────────────────────────────────────────────
#   symbol          海外标的代码(yfinance 口径;指数带 `^`)
#   kind            company | etf | index   ← **ETF / 指数不得伪装成公司或财报主体**
#   relation        customer | supplier | peer | theme
#   direction       downstream | upstream | peer
#   rationale       为什么值得看(一句话;**不写方向、不写涨跌传导**)
#   evidence_url    公网 http(s) 凭证;没有真凭证 → null(必须同时标 pending_evidence)
#   effective_from  起效日(必填)
#   effective_to    失效日;null = 长期有效。季度复核让过期项**自动停止消费**
#   status          pending_evidence | active | delisted | suspended | halted | unlisted | expired
#   tradable        可选三态布尔;lint 的在线解析器可回填。false ⇒ 不消费
#
# ── 规模纪律 ───────────────────────────────────────────────────────────────────────────────
#   单层 ≤4 项(超出由 owner 人工取舍,lint 判 ERROR);个股 `codes` 优先于 `industries`
#   (命中 code 就**只用** code 名单,不与行业名单合并);空名单 = 整块省略。
#   行业名用 scan 帧里的真实行业名(申万口径,如「半导体」「消费电子」),对不上 = 永远命中不了。

