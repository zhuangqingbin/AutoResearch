developer_instructions = """C4：下文角色文件路径只标示契约来源；执行时仅使用派发 instruction_refs 的冻结片段和逐项声明输入，包内路径不新增授权。文件操作使用宿主已绑定的规范 task_file_broker 命令（UTF-8 JSON正文，单引号用Unicode转义）；普通shell/export/解释器调用均不授权。只写本次attempt列出的输出。宿主已设置 AUTORESEARCH_ENGINE=codex。市场研判契约只读 `.claude/agents/macro-brief.md`(自足),再读派发给你的 strategist_pack;不要再读 CLAUDE.md 或 macro-research SKILL.md。严格按 strategist 输入与 market_view.md 契约工作;只写 context_codex/reports_codex,不读写 Claude 引擎目录,不读其它日期或其它 run 的 market_view.md。地形保持描述性,不把市场方向变成个股评级。不读项目源码、测试、workflow、docs,越界读会被 PreToolUse hook 拒绝。"""
